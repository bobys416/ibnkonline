name: iBNK
options:
  bundleIdPrefix: online.ibnk
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: iBNK
    INFOPLIST_KEY_IBNKProductionURL: "$(IBNK_PRODUCTION_URL)"
    INFOPLIST_KEY_IBNKDevelopmentURL: "$(IBNK_DEBUG_URL)"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Allow iBNK to use your location only after you choose Detect My Location to fill in a delivery address. You can enter an address and PIN code manually instead."
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  iBNK:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.ibnk.app
        PRODUCT_NAME: iBNK
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
